services:
  keydb:
    image: eqalpha/keydb:latest
    container_name: ann-keydb
    command: keydb-server /etc/keydb/keydb.conf --requirepass ${KEYDB_PASSWORD} --server-threads 1
    ports:
      - "127.0.0.1:6379:6379"  # Accessible only from the host
    networks:
      - ann-network
    restart: always

  backend-server:
    image: kaetaro13/beats-game-server
    container_name: backend-server
    ports:
      - "127.0.0.1:8081:8085"  # Accessible only from the host
    env_file:
      - ./.env
    networks:
      - ann-network
    restart: always

  game-server:
    image: kaetaro13/godot-server:latest
    container_name: game-server
    ports:
      - "127.0.0.1:8090:8087/tcp"  # Accessible only from the host
      - "127.0.0.1:8090:8087/udp"
    environment:
      KEYDB_PASSWORD: "${KEYDB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      
    networks:
      - ann-network
    restart: always

networks:
  ann-network:
    driver: bridge