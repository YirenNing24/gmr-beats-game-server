services:
  backend-server:
    image: kaetaro13/beats-game-server
    container_name: backend-server
    ports:
      - "127.0.0.1:8081:8085"
    env_file:
      - ./.env
    networks:
      - ann-network
    restart: always

  game-server:
    image: kaetaro13/godot-server:latest
    networks:
      - ann-network
    deploy:
      replicas: 2
    ports:
      - "127.0.0.1:9087-9088:8087" # Mapping ports for two instances (9087 and 9088)
    restart: always # Ensures game-server instances restart if stopped

# Define the networks
networks:
  ann-network:
    driver: bridge
