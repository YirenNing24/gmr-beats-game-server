services:
  keydb:
    image: eqalpha/keydb:latest
    container_name: ann-keydb
    command: keydb-server /etc/keydb/keydb.conf --requirepass ${KEYDB_PASSWORD} --server-threads 1
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - ann-network
    restart: always

  backend-server:
    image: kaetaro13/beats-game-server
    container_name: backend-server
    ports:
      - "127.0.0.1:8081:8085"  # maps container port 8085 -> host 8081
    env_file:
      - ./.env
    networks:
      - ann-network
    restart: always

  backend-server-2:
    image: kaetaro13/beats-game-server
    container_name: backend-server-2
    ports:
      - "127.0.0.1:8082:8085"  # maps container port 8085 -> host 8082
    env_file:
      - ./.env
    networks:
      - ann-network
    restart: always



networks:
  ann-network:
    driver: bridge
